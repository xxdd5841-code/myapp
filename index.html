<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>书房 · 个人工作台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='2.5' y='3.5' width='19' height='17' rx='3' fill='%233E6B57'/%3E%3Cpath d='M12 7.2c-1.8-1.4-3.6-1.4-5.4 0v9.2c1.8-1.4 3.6-1.4 5.4 0 1.8-1.4 3.6-1.4 5.4 0V7.2c-1.8-1.4-3.6-1.4-5.4 0z' fill='%23FBF8F0'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://miaoda.feishu.cn" crossorigin>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@500;600;700;900&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5A2.5 2.5 0 016.5 4H12v16H6.5A2.5 2.5 0 014 17.5zM20 6.5A2.5 2.5 0 0017.5 4H12v16h5.5A2.5 2.5 0 0020 17.5z"/></svg>
      </span>
      <div class="brand-text">
        <h1 id="greetingTitle">上午好</h1>
        <p id="todayLine">—</p>
      </div>
    </div>

    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.2-3.2"/></svg>
      <input id="globalSearch" type="text" placeholder="搜索链接、待办、书摘、单词…" autocomplete="off" spellcheck="false">
      <div id="searchResults" class="search-results" hidden></div>
    </div>

    <div class="top-actions">
      <button id="weatherChip" class="weather-chip" title="点击切换城市">
        <span id="weatherIcon" class="weather-chip-icon"></span>
        <span id="weatherText">天气加载中</span>
      </button>
      <button id="settingsBtn" class="icon-btn" title="设置与数据">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/><circle cx="7" cy="7" r="2" fill="var(--card)"/><circle cx="17" cy="12" r="2" fill="var(--card)"/><circle cx="9" cy="17" r="2" fill="var(--card)"/></svg>
      </button>
    </div>
  </div>
</header>

<main class="page">
  <div id="dashboard" class="dashboard"></div>
</main>

<footer class="foot">
  <span id="saveHint">数据自动保存在本机浏览器（localStorage）</span>
  <span class="foot-dot">·</span>
  <span id="lastSave">—</span>
</footer>

<div id="modalOverlay" class="modal-overlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-head">
      <h2 id="modalTitle"></h2>
      <button id="modalClose" class="icon-btn" title="关闭">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div id="modalBody" class="modal-body"></div>
  </div>
</div>

<div id="toastWrap" class="toast-wrap" aria-live="polite"></div>

<!-- 城市切换小浮层 -->
<div id="cityPop" class="city-pop" hidden>
  <input id="cityInput" type="text" placeholder="输入城市名，如：西安" autocomplete="off" spellcheck="false">
  <div class="city-pop-actions">
    <button id="cityOk" class="btn btn-primary">确认</button>
    <button id="cityCancel" class="btn">取消</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
